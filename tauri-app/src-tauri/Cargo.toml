[package]
name    = "sshive-app"
version = "0.4.0"
edition = "2021"

[lib]
name = "sshive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde                        = { version = "1", features = ["derive"] }
serde_json                   = "1"
tokio                        = { version = "1", features = ["rt-multi-thread", "fs", "process", "io-util"] }
sshive                       = { path = "../..", default-features = false }
chrono                       = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid                         = { version = "1", features = ["v4", "serde"] }
dirs                         = "6.0"

[profile.release]
opt-level     = "z"      # optimise la taille (pas la vitesse)
lto           = true     # LTO complet — élimine le code mort inter-crates
codegen-units = 1        # un seul CGU pour maximiser l'inlining/élimination
strip         = "symbols"
panic         = "abort"  # supprime la machinerie de stack-unwinding (~10-15% binaire)

[profile.dev]
# build incrémental rapide en dev
opt-level = 0
debug     = true
